# Dev infrastructure for FireCare: PostgreSQL (with PostGIS) + MinIO (S3-compatible storage).
# Start with: docker compose up -d
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: firecare-db
    environment:
      POSTGRES_USER: firecare
      POSTGRES_PASSWORD: firecare
      POSTGRES_DB: firecare
    ports:
      - '55432:5432'
    volumes:
      - firecare-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U firecare -d firecare']
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: minio/minio:latest
    container_name: firecare-storage
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: firecare
      MINIO_ROOT_PASSWORD: firecare123
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - firecare-storage-data:/data

volumes:
  firecare-db-data:
  firecare-storage-data:
